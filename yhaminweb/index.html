<!DOCTYPE html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="权限管理后台 - 企业级权限管理平台" />
    <title>权限管理后台</title>
    <style>
      html, body, #app { height: 100%; margin: 0; padding: 0; }
      #loader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #F0F2F5; font-family: "Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
        color: #909399; z-index: 9999;
      }
      #loader .spinner {
        width: 36px; height: 36px; border: 3px solid #DCDFE6; border-top-color: #409EFF;
        border-radius: 50%; animation: ry-spin 0.8s linear infinite;
      }
      @keyframes ry-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="loader"><div class="spinner"></div></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
